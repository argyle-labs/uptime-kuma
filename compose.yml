services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - /opt/appdata/uptime-kuma:/app/data
    environment:
      - TZ=${TZ:-America/Denver}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/entry', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
